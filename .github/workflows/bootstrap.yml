name: bootstrap-scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check bootstrap payload
        id: payload
        run: |
          if [[ -f .bootstrap/bundle.part00 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reassemble build archive
        if: steps.payload.outputs.present == 'true'
        run: |
          cat .bootstrap/bundle.part* | base64 -d > /tmp/omarchy-scope.zip
          rm -rf /tmp/omarchy-scope-unpack
          mkdir -p /tmp/omarchy-scope-unpack
          unzip -q /tmp/omarchy-scope.zip -d /tmp/omarchy-scope-unpack
      - name: Materialize SCOPE v0.1.0
        if: steps.payload.outputs.present == 'true'
        run: |
          cp -a /tmp/omarchy-scope-unpack/omarchy-scope/. .
          chmod 0755 bin/scope-helper
          rm -rf .bootstrap
          rm -f .github/workflows/test.yml
      - name: Verify build
        if: steps.payload.outputs.present == 'true'
        run: |
          python3 -m py_compile bin/scope-helper
          python3 -m unittest discover -s tests -v
          git diff --check
      - name: Commit build
        if: steps.payload.outputs.present == 'true'
        run: |
          git config user.name "Drecullith"
          git config user.email "84670591+Drecullith@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build SCOPE v0.1.0 engagement HUD"
          git push origin HEAD:main
